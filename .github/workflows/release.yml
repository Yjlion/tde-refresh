name: release

# Build the .debs for each supported Debian release and publish them as
# downloadable GitHub Release assets whenever a version tag (e.g. v1.1) is
# pushed. The bookworm files carry ~bpo12+1 in their version, so the names
# do not collide.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish .deb (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [trixie, bookworm]
    container: debian:${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper lintian \
            desktop-base librsvg2-bin fonts-dejavu-core

      - name: Build
        run: |
          dpkg-buildpackage -us -uc
          mkdir out
          mv ../tde-refresh-*_* out/

      - name: Lintian
        run: lintian out/*.changes

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.deb
          generate_release_notes: true
