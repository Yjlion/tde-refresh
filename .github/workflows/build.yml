name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build package (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            theme: ceratopsian
          - suite: bookworm
            theme: emerald
    container: debian:${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper lintian \
            desktop-base librsvg2-bin fonts-dejavu-core

      - name: Build
        run: |
          dpkg-buildpackage -us -uc
          mkdir out
          mv ../tde-refresh-*_* out/

      - name: Lintian
        run: lintian out/*.changes

      - name: Theme matches the release (${{ matrix.theme }})
        run: |
          dpkg-deb -c out/tde-refresh-desktop-base-trinity_*.deb \
            | grep -q "tdm/themes/${{ matrix.theme }}/background.png"
          dpkg-deb -c out/tde-refresh-desktop-base-trinity_*.deb \
            | grep -q "usr/share/wallpapers/${{ matrix.theme }}.png"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.suite }}
          path: out/*.deb

  dep-check:
    name: Dependencies resolve against TDE ${{ matrix.suite }} repo
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, bookworm]
    container: debian:${{ matrix.suite }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.suite }}

      - name: Enable TDE ${{ matrix.suite }} repository
        run: |
          apt-get update
          apt-get install -y --no-install-recommends wget ca-certificates
          wget http://mirror.ppa.trinitydesktop.org/trinity/deb/trinity-keyring.deb
          dpkg -i trinity-keyring.deb
          echo "deb http://mirror.ppa.trinitydesktop.org/trinity/deb/trinity-r14.1.x ${{ matrix.suite }} main deps" \
            > /etc/apt/sources.list.d/tde.list
          apt-get update

      - name: Dry-run install (verifies every dependency name resolves)
        run: apt-get install -s ./tde-refresh-*_all.deb
